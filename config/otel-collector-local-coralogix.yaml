# Local dev: receive OTLP on 4317/4318, forward traces + logs to Coralogix US2.
#
#   export CORALOGIX_PRIVATE_KEY=cxtp_...
#   docker run --rm -p 4317:4317 -p 4318:4318 \
#     -e CORALOGIX_PRIVATE_KEY \
#     -v "$PWD/config/otel-collector-local-coralogix.yaml:/etc/otelcol-contrib/config.yaml:ro" \
#     otel/opentelemetry-collector-contrib:0.115.1 \
#     --config=/etc/otelcol-contrib/config.yaml
#
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 256

exporters:
  debug:
    verbosity: basic
  otlp/coralogix:
    endpoint: ingress.us2.coralogix.com:443
    tls:
      insecure: false
    headers:
      Authorization: Bearer ${env:CORALOGIX_PRIVATE_KEY}

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp/coralogix]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp/coralogix]
