sim: anthropic_admin
description: Anthropic Admin / analytics / compliance gauges for Governance & Risk Audit, plus Claude Products analytics.

checks:
  - id: anthropic_admin.spend
    title: Total tracked spend (actual)
    kind: promql
    expect: has_nonzero
    notes: Dashboard gauge; amount_type=actual. Metric is a gauge, not a counter.
    query: |
      sum(max_over_time(anthropic_analytics_user_cost{amount_type="actual",job="otel-anthropic-admin-sim"}[86400s]))

  - id: anthropic_admin.active_users
    title: Active users (any usage)
    kind: promql
    expect: has_nonzero
    query: |
      count(count by (user_email) (max_over_time(anthropic_analytics_user_tokens{job="otel-anthropic-admin-sim"}[86400s])))

  - id: anthropic_admin.licensed_members
    title: Licensed org members
    kind: promql
    expect: has_nonzero
    query: |
      sum(max_over_time(anthropic_compliance_org_users_total{job="otel-anthropic-admin-sim"}[86400s]))

  - id: anthropic_admin.distinct_keys
    title: Distinct API keys seen
    kind: promql
    expect: has_nonzero
    query: |
      count(count by (api_key_id) (max_over_time(anthropic_admin_api_key_usage{job="otel-anthropic-admin-sim"}[86400s])))

  - id: anthropic_admin.usage.by_model
    title: API key usage by key and model
    kind: promql
    expect: has_nonzero
    query: |
      sum by (api_key_id, model, token_type) (max_over_time(anthropic_admin_api_key_usage{job="otel-anthropic-admin-sim"}[86400s]))

  - id: anthropic_admin.rate_limit
    title: Admin rate-limit gauges present
    kind: promql
    expect: has_nonzero
    query: |
      max(anthropic_admin_rate_limit_value{job="otel-anthropic-admin-sim"})

  - id: anthropic_admin.cost
    title: Admin cost gauge (minor USD units)
    kind: promql
    expect: has_nonzero
    query: |
      max(anthropic_admin_cost_amount{job="otel-anthropic-admin-sim"})

  - id: anthropic_admin.requests_by_user
    title: Requests by user
    kind: promql
    expect: has_nonzero
    query: |
      topk(25, sum by (user_email) (max_over_time(anthropic_analytics_user_requests{job="otel-anthropic-admin-sim"}[86400s])))

  - id: anthropic_admin.org_roles
    title: Org roles breakdown
    kind: promql
    expect: has_nonzero
    query: |
      sum by (role) (max_over_time(anthropic_compliance_org_users_total{job="otel-anthropic-admin-sim"}[86400s]))

  - id: anthropic_admin.activity
    title: Compliance activity events
    kind: promql
    expect: has_nonzero
    query: |
      sum by (type, user_id, user_ip, user_type) (max_over_time(anthropic_compliance_activity_events_total{job="otel-anthropic-admin-sim"}[86400s]))

  - id: anthropic_admin.logs.api_keys_usage
    title: anthropic.api_keys_usage integration logs
    kind: dataprime
    expect: has_rows
    window: 24h
    limit: 5
    tier: archive
    notes: TCO medium; query archive. Application is anthropic / testing.
    query: |
      source logs
      | filter $l.applicationname == 'anthropic'
      | filter firstNonNull($d.attributes['stream'], $d.stream) == 'anthropic.api_keys_usage'
      | limit 5

  - id: anthropic_admin.tokens.by_product
    title: Claude Products tokens by product
    kind: promql
    expect: has_nonzero
    notes: AI Center Claude products; daily snapshot gauges, use max_over_time.
    query: |
      sum by (product) (max_over_time(anthropic_analytics_tokens{job="otel-anthropic-admin-sim"}[10d]))

  - id: anthropic_admin.seats
    title: Assigned seats
    kind: promql
    expect: has_nonzero
    query: |
      max(max_over_time(anthropic_analytics_seats_assigned{job="otel-anthropic-admin-sim"}[10d]))

  - id: anthropic_admin.user_sessions
    title: User sessions by product
    kind: promql
    expect: has_nonzero
    query: |
      sum by (product) (max_over_time(anthropic_analytics_user_sessions{job="otel-anthropic-admin-sim"}[10d]))

  - id: anthropic_admin.user_commits
    title: User commits (Claude Products detail)
    kind: promql
    expect: has_nonzero
    notes: >
      HAR widget max_over_time(anthropic_analytics_user_commits[86400s]);
      labels user_id/user_email/product (USER_PRODUCT_LABELS).
    query: |
      sum by (product) (max_over_time(anthropic_analytics_user_commits{job="otel-anthropic-admin-sim"}[10d]))

  - id: anthropic_admin.user_lines_added
    title: User lines added
    kind: promql
    expect: has_nonzero
    query: |
      sum by (product) (max_over_time(anthropic_analytics_user_lines_added{job="otel-anthropic-admin-sim"}[10d]))

  - id: anthropic_admin.user_pull_requests
    title: User pull requests
    kind: promql
    expect: has_nonzero
    query: |
      sum by (product) (max_over_time(anthropic_analytics_user_pull_requests{job="otel-anthropic-admin-sim"}[10d]))

  - id: anthropic_admin.skill_users
    title: Skill users (Claude Products)
    kind: promql
    expect: has_nonzero
    notes: Org skill tile; cxai labels skill_name (+ share_status when present).
    query: |
      sum by (skill_name) (max_over_time(anthropic_analytics_skill_users{job="otel-anthropic-admin-sim"}[10d]))

  - id: anthropic_admin.skill_invocations
    title: Skill invocations
    kind: promql
    expect: has_nonzero
    query: |
      sum by (skill_name) (max_over_time(anthropic_analytics_skill_invocations{job="otel-anthropic-admin-sim"}[10d]))

  - id: anthropic_admin.connector_users
    title: Connector users
    kind: promql
    expect: has_nonzero
    query: |
      sum by (connector_name) (max_over_time(anthropic_analytics_connector_users{job="otel-anthropic-admin-sim"}[10d]))

  - id: anthropic_admin.connector_calls
    title: Connector calls by type
    kind: promql
    expect: has_nonzero
    query: |
      sum by (connector_name, call_type) (max_over_time(anthropic_analytics_connector_calls{job="otel-anthropic-admin-sim"}[10d]))

  - id: anthropic_admin.users_by_group
    title: Users view tokens/requests with group filter
    kind: promql
    expect: has_nonzero
    notes: >
      Claude Products Users table injects group= on user_tokens and user_requests;
      empty when those series lack a group label.
    query: |
      sum by (user_email, group) (max_over_time(anthropic_analytics_user_tokens{job="otel-anthropic-admin-sim"}[10d]))

  - id: anthropic_admin.cost.by_group
    title: Cost by group (Claude Products widget)
    kind: promql
    expect: has_nonzero
    notes: >
      UI getCostByGroup joins sum by (group, amount_type) on anthropic_analytics_cost,
      sum by (group, token_type) on anthropic_analytics_tokens, and sum by (group) on
      anthropic_org_requests_total. Empty when those org series lack a group label.
    query: |
      sum by (group) (max_over_time(anthropic_analytics_cost{amount_type="actual",job="otel-anthropic-admin-sim"}[10d]))

  - id: anthropic_admin.logs.summary_active_users
    title: anthropic.summary.active_users integration logs
    kind: dataprime
    expect: has_rows
    window: 24h
    limit: 5
    tier: archive
    query: |
      source logs
      | filter $l.applicationname == 'anthropic'
      | filter firstNonNull($d.attributes['stream'], $d.stream) == 'anthropic.summary.active_users'
      | limit 5

  - id: anthropic_admin.logs.user_activity
    title: anthropic.user_activity integration logs
    kind: dataprime
    expect: has_rows
    window: 24h
    limit: 5
    tier: archive
    query: |
      source logs
      | filter $l.applicationname == 'anthropic'
      | filter firstNonNull($d.attributes['stream'], $d.stream) == 'anthropic.user_activity'
      | limit 5

  - id: anthropic_admin.logs.skills
    title: anthropic.skills integration logs
    kind: dataprime
    expect: has_rows
    window: 24h
    limit: 5
    tier: archive
    query: |
      source logs
      | filter $l.applicationname == 'anthropic'
      | filter firstNonNull($d.attributes['stream'], $d.stream) == 'anthropic.skills'
      | limit 5

  - id: anthropic_admin.logs.connectors
    title: anthropic.connectors integration logs
    kind: dataprime
    expect: has_rows
    window: 24h
    limit: 5
    tier: archive
    query: |
      source logs
      | filter $l.applicationname == 'anthropic'
      | filter firstNonNull($d.attributes['stream'], $d.stream) == 'anthropic.connectors'
      | limit 5
