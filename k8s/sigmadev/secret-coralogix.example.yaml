# Copy to secret-coralogix.yaml (gitignored), fill key, then apply:
#   kubectl apply -n codeagentsim -f k8s/sigmadev/secret-coralogix.yaml
#
# Or let scripts/deploy-sigmadev.sh create the secret from CORALOGIX_PRIVATE_KEY.
apiVersion: v1
kind: Secret
metadata:
  name: coralogix-otel
  namespace: codeagentsim
type: Opaque
stringData:
  private_key: REPLACE_WITH_SEND_YOUR_DATA_KEY
