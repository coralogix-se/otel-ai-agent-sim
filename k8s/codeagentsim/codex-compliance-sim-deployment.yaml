# Standalone Codex Compliance + Analytics simulator.
# Separate from otel-ai-agent-sim (Codex CLI spans) and otel-openai-admin-sim (API Platform).
# Prometheus scraped on :9090 by otel-collector-codeagentsim.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-codex-compliance-sim
  namespace: codeagentsim
  labels:
    app: otel-codex-compliance-sim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-codex-compliance-sim
  template:
    metadata:
      labels:
        app: otel-codex-compliance-sim
    spec:
      initContainers:
        - name: wait-for-collector
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z otel-collector-codeagentsim 24317; do echo waiting for otel collector otlp-grpc; sleep 2; done"
      containers:
        - name: sim
          image: 827602716714.dkr.ecr.us-west-2.amazonaws.com/otel-ai-agent-sim:demo-shape-20261112a
          imagePullPolicy: Always
          command: ["python", "-m", "sim.codex_compliance"]
          env:
            - name: PROMETHEUS_METRICS_PORT
              value: "9090"
            - name: PROMETHEUS_REMOTE_WRITE_ENABLED
              value: "false"
            - name: CODEX_COMPLIANCE_CX_APPLICATION_NAME
              value: openai-integration
            - name: CODEX_COMPLIANCE_CX_SUBSYSTEM_NAME
              value: codex-compliance-sim
            - name: DEPLOYMENT_ENVIRONMENT
              value: codeagentsim
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SIM_CODEX_COMPLIANCE_INTERVAL_SEC
              value: "60"
            - name: SIM_CODEX_COMPLIANCE_WORKSPACES
              value: "1"
            - name: SIM_CODEX_COMPLIANCE_USERS
              value: "16"
            - name: SIM_CODEX_COMPLIANCE_BACKFILL_DAYS
              value: "28"
            - name: SIM_CODEX_COMPLIANCE_VOLUME
              value: "1.0"
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: otel-codex-compliance-sim
  namespace: codeagentsim
  labels:
    app: otel-codex-compliance-sim
spec:
  type: ClusterIP
  selector:
    app: otel-codex-compliance-sim
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
