# Fan-out: OTLP traces/logs -> ingress.us2 + ingress.eu1 + ingress.us2 (onlineboutique-dev tenant, separate key).
# Prometheus: scrape sim Service :9090 -> remote_write to all three exporters (no duplicate OTLP metrics).
# Receiver ports 24317/24318 avoid overlapping another collector using 4317/4318 in-cluster.
#
# Payload note (2026-10): openai-admin alone is ~50MB / ~140k series; anthropic ~17MB; main sim ~12MB.
# Default 15s scrapes + 5s remote_write timeouts caused permanent "context deadline exceeded" drops.
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-codeagentsim-config
  namespace: codeagentsim
  labels:
    app: otel-collector-codeagentsim
data:
  config.yaml: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13134

    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:24317
          http:
            endpoint: 0.0.0.0:24318
      prometheus:
        trim_metric_suffixes: false
        config:
          scrape_configs:
            # Heavier targets: longer interval/timeout so one scrape finishes before the next.
            - job_name: otel-ai-agent-sim
              scrape_interval: 30s
              scrape_timeout: 25s
              static_configs:
                - targets:
                    - otel-ai-agent-sim:9090
            - job_name: otel-anthropic-admin-sim
              scrape_interval: 30s
              scrape_timeout: 25s
              static_configs:
                - targets:
                    - otel-anthropic-admin-sim:9090
            - job_name: otel-openai-admin-sim
              scrape_interval: 60s
              scrape_timeout: 55s
              static_configs:
                - targets:
                    - otel-openai-admin-sim:9090

    processors:
      # Backpressure before the kernel OOM killer; keep limit_mib ~75–80% of the pod memory limit (3Gi).
      memory_limiter:
        check_interval: 5s
        limit_mib: 2400
        spike_limit_mib: 384
      # Metrics scrapes are large (~10–50MB); tiny batches create thousands of HTTP POSTs and timeout.
      batch:
        timeout: 2s
        send_batch_size: 8192
        send_batch_max_size: 16384

    exporters:
      otlp/us2:
        endpoint: ingress.us2.coralogix.com:443
        tls:
          insecure: false
        timeout: 30s
        headers:
          Authorization: Bearer ${env:CORALOGIX_PRIVATE_KEY_US2}

      otlp/eu1:
        endpoint: ingress.eu1.coralogix.com:443
        tls:
          insecure: false
        timeout: 30s
        headers:
          Authorization: Bearer ${env:CORALOGIX_PRIVATE_KEY_EU1}

      # Same US2 ingress as ``otlp/us2``; distinct Send-Your-Data key for Coralogix instance ``onlineboutique-dev``
      # (secret key ``private_key_onlineboutique_dev`` — UI label ``Default-Api-key``).
      otlp/us2-onlineboutique:
        endpoint: ingress.us2.coralogix.com:443
        tls:
          insecure: false
        timeout: 30s
        headers:
          Authorization: Bearer ${env:CORALOGIX_PRIVATE_KEY_ONLINEBOUTIQUE_DEV}

      prometheusremotewrite/us2:
        endpoint: https://ingress.us2.coralogix.com/prometheus/v1
        tls:
          insecure: false
        headers:
          Authorization: Bearer ${env:CORALOGIX_PRIVATE_KEY_US2}
        # Keep scrape names as-is (cxai-dev claude_code_active_time_total_s_total).
        # Default UnderscoreEscapingWithSuffixes rewrites that to claude_code_active_time_s_total.
        # NoTranslation requires Prometheus Remote Write 2.0; this cluster uses PRW 1.0.
        translation_strategy: UnderscoreEscapingWithoutSuffixes
        # Default timeout (~5s) cannot finish a ~3MB snappy batch under fan-out load.
        timeout: 90s
        max_batch_size_bytes: 3000000
        remote_write_queue:
          enabled: true
          queue_size: 50000
          num_consumers: 1
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s

      prometheusremotewrite/eu1:
        endpoint: https://ingress.eu1.coralogix.com/prometheus/v1
        tls:
          insecure: false
        headers:
          Authorization: Bearer ${env:CORALOGIX_PRIVATE_KEY_EU1}
        translation_strategy: UnderscoreEscapingWithoutSuffixes
        timeout: 90s
        max_batch_size_bytes: 3000000
        remote_write_queue:
          enabled: true
          queue_size: 50000
          num_consumers: 1
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s

      prometheusremotewrite/us2-onlineboutique:
        endpoint: https://ingress.us2.coralogix.com/prometheus/v1
        tls:
          insecure: false
        headers:
          Authorization: Bearer ${env:CORALOGIX_PRIVATE_KEY_ONLINEBOUTIQUE_DEV}
        translation_strategy: UnderscoreEscapingWithoutSuffixes
        timeout: 90s
        max_batch_size_bytes: 3000000
        remote_write_queue:
          enabled: true
          queue_size: 50000
          num_consumers: 1
        retry_on_failure:
          enabled: true
          initial_interval: 5s
          max_interval: 30s
          max_elapsed_time: 300s

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/us2, otlp/eu1, otlp/us2-onlineboutique]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/us2, otlp/eu1, otlp/us2-onlineboutique]
        metrics:
          receivers: [prometheus]
          processors: [memory_limiter, batch]
          exporters: [prometheusremotewrite/us2, prometheusremotewrite/eu1, prometheusremotewrite/us2-onlineboutique]
