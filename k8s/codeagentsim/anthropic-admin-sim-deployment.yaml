# Standalone Anthropic Admin API usage/cost simulator.
# Separate process from otel-ai-agent-sim (Claude Code / Gemini / Copilot / …).
# OTLP logs -> otel-collector-codeagentsim:24317; Prometheus scraped on :9090.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-anthropic-admin-sim
  namespace: codeagentsim
  labels:
    app: otel-anthropic-admin-sim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-anthropic-admin-sim
  template:
    metadata:
      labels:
        app: otel-anthropic-admin-sim
    spec:
      initContainers:
        - name: wait-for-collector
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z otel-collector-codeagentsim 24317; do echo waiting for otel collector otlp-grpc; sleep 2; done"
      containers:
        - name: sim
          image: 827602716714.dkr.ecr.us-west-2.amazonaws.com/otel-ai-agent-sim:demo-cost-reconcile-202608281756
          imagePullPolicy: Always
          command: ["python", "-m", "sim.anthropic_admin"]
          env:
            - name: OTLP_ENDPOINT
              value: otel-collector-codeagentsim:24317
            - name: OTLP_INSECURE
              value: "true"
            - name: PROMETHEUS_METRICS_PORT
              value: "9090"
            - name: PROMETHEUS_REMOTE_WRITE_ENABLED
              value: "false"
            - name: OTEL_SERVICE_NAME
              value: anthropic-admin-api
            - name: ANTHROPIC_ADMIN_CX_APPLICATION_NAME
              value: Claude
            - name: ANTHROPIC_ADMIN_CX_SUBSYSTEM_NAME
              value: Enterprise API
            - name: DEPLOYMENT_ENVIRONMENT
              value: test-cluster
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            # Minute-level Admin usage buckets. Cost reports once per UTC day (first cycle also emits).
            # Volume tuned so org daily tokens land ~80–150M (≈3–6M/user), near Anthropic Claude Code
            # averages (~$13/active day ≈ a few million tokens), not multi-billion sim floods.
            - name: SIM_ANTHROPIC_ADMIN_INTERVAL_SEC
              value: "60"
            - name: SIM_ANTHROPIC_ADMIN_EMITS_PER_CYCLE
              value: "6"
            - name: SIM_ANTHROPIC_ADMIN_VOLUME
              value: "0.08"
            - name: SIM_ANTHROPIC_ADMIN_API_KEYS
              value: "6"
            - name: SIM_ANTHROPIC_ADMIN_USERS
              value: "24"
            - name: SIM_ANTHROPIC_ADMIN_WORKSPACES
              value: "2"
            - name: SIM_ANTHROPIC_ADMIN_COST_LOG_SEC
              value: "86400"
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: otel-anthropic-admin-sim
  namespace: codeagentsim
  labels:
    app: otel-anthropic-admin-sim
spec:
  type: ClusterIP
  selector:
    app: otel-anthropic-admin-sim
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
