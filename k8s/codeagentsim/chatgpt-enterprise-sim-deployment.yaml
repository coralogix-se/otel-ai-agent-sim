# Standalone ChatGPT Enterprise simulator (adoption dashboard + AISPM compliance posture).
# Separate from otel-openai-admin-sim (API Platform) and the generic ChatGPT agent in otel-ai-agent-sim.
# Prometheus scraped on :9090 by otel-collector-codeagentsim.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-chatgpt-enterprise-sim
  namespace: codeagentsim
  labels:
    app: otel-chatgpt-enterprise-sim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-chatgpt-enterprise-sim
  template:
    metadata:
      labels:
        app: otel-chatgpt-enterprise-sim
    spec:
      initContainers:
        - name: wait-for-collector
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z otel-collector-codeagentsim 24317; do echo waiting for otel collector otlp-grpc; sleep 2; done"
      containers:
        - name: sim
          image: 827602716714.dkr.ecr.us-west-2.amazonaws.com/otel-ai-agent-sim:demo-shape-20261112a
          imagePullPolicy: Always
          command: ["python", "-m", "sim.chatgpt_enterprise"]
          env:
            - name: PROMETHEUS_METRICS_PORT
              value: "9090"
            - name: PROMETHEUS_REMOTE_WRITE_ENABLED
              value: "false"
            - name: CHATGPT_ENTERPRISE_CX_APPLICATION_NAME
              value: openai-integration
            - name: CHATGPT_ENTERPRISE_CX_SUBSYSTEM_NAME
              value: chatgpt-enterprise-sim
            - name: DEPLOYMENT_ENVIRONMENT
              value: codeagentsim
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SIM_CHATGPT_ENTERPRISE_INTERVAL_SEC
              value: "60"
            - name: SIM_CHATGPT_ENTERPRISE_WORKSPACES
              value: "1"
            - name: SIM_CHATGPT_ENTERPRISE_USERS
              value: "16"
            - name: SIM_CHATGPT_ENTERPRISE_BACKFILL_DAYS
              value: "28"
            - name: SIM_CHATGPT_ENTERPRISE_VOLUME
              value: "1.0"
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
---
apiVersion: v1
kind: Service
metadata:
  name: otel-chatgpt-enterprise-sim
  namespace: codeagentsim
  labels:
    app: otel-chatgpt-enterprise-sim
spec:
  type: ClusterIP
  selector:
    app: otel-chatgpt-enterprise-sim
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
