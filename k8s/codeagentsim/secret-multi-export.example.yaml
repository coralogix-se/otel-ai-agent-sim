# Copy to secret-multi-export.yaml (gitignored locally), fill keys, then kubectl apply -n codeagentsim -f secret-multi-export.yaml
# Or create from the shell:
#   kubectl create secret generic coralogix-multi-export -n codeagentsim \
#     --from-literal=private_key_us2='YOUR_US2_SEND_YOUR_DATA_KEY' \
#     --from-literal=private_key_eu1='YOUR_EU1_SEND_YOUR_DATA_KEY' \
#     --from-literal=private_key_onlineboutique_dev='DEFAULT_API_KEY_ONLINEBOUTIQUE_DEV'
#
# ``private_key_onlineboutique_dev``: Send-Your-Data key for the **onlineboutique-dev** Coralogix instance (US2 ingress).
# In that tenant’s UI this credential is shown as **Default-Api-key** (distinct from the other US2 key).
apiVersion: v1
kind: Secret
metadata:
  name: coralogix-multi-export
  namespace: codeagentsim
type: Opaque
stringData:
  private_key_us2: REPLACE_WITH_US2_KEY
  private_key_eu1: REPLACE_WITH_EU1_KEY
  private_key_onlineboutique_dev: REPLACE_ONLINEBOUTIQUE_DEV_DEFAULT_API_KEY
