apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector-codeagentsim
  namespace: codeagentsim
  labels:
    app: otel-collector-codeagentsim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector-codeagentsim
  template:
    metadata:
      labels:
        app: otel-collector-codeagentsim
    spec:
      # EKS nodes are IPv4-only; Coralogix ingress publishes AAAA and Go dials IPv6 first
      # ("network is unreachable"), burning budget into remote_write deadlines. Pin A records.
      initContainers:
        - name: coralogix-ipv4-hosts
          image: busybox:1.36
          command:
            - sh
            - -ec
            - |
              cp /etc/hosts /work/hosts
              for host in ingress.us2.coralogix.com ingress.eu1.coralogix.com; do
                IP=$(nslookup "$host" 2>/dev/null | awk '/^Address: / { print $2 }' | grep -E '^[0-9]+\.' | tail -1)
                if [ -z "$IP" ]; then echo "failed to resolve $host A record"; exit 1; fi
                grep -v "[[:space:]]${host}$" /work/hosts > /work/hosts.tmp
                mv /work/hosts.tmp /work/hosts
                echo "$IP $host" >> /work/hosts
                echo "pinned $host -> $IP"
              done
          volumeMounts:
            - name: etc-hosts
              mountPath: /work
      containers:
        - name: otelcol
          # Live cluster was 0.115.1 until this rollout; 0.158.0 supports translation_strategy: NoTranslation.
          image: otel/opentelemetry-collector-contrib:0.158.0
          args:
            - --config=/etc/otelcol/config.yaml
          ports:
            - name: otlp-grpc
              containerPort: 24317
              protocol: TCP
            - name: otlp-http
              containerPort: 24318
              protocol: TCP
            - name: health
              containerPort: 13134
              protocol: TCP
          env:
            - name: CORALOGIX_PRIVATE_KEY_US2
              valueFrom:
                secretKeyRef:
                  name: coralogix-multi-export
                  key: private_key_us2
            - name: CORALOGIX_PRIVATE_KEY_EU1
              valueFrom:
                secretKeyRef:
                  name: coralogix-multi-export
                  key: private_key_eu1
            # onlineboutique-dev Coralogix instance (US2); same ingress as US2 exporter #1, different API key.
            - name: CORALOGIX_PRIVATE_KEY_ONLINEBOUTIQUE_DEV
              valueFrom:
                secretKeyRef:
                  name: coralogix-multi-export
                  key: private_key_onlineboutique_dev
          volumeMounts:
            - name: etc-hosts
              mountPath: /etc/hosts
              subPath: hosts
              readOnly: true
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 1536Mi
            limits:
              # Triple remote_write of ~200k series needs headroom above 1 CPU.
              cpu: "2"
              memory: 3Gi
      volumes:
        - name: etc-hosts
          emptyDir: {}
        - name: config
          configMap:
            name: otel-collector-codeagentsim-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-codeagentsim
  namespace: codeagentsim
  labels:
    app: otel-collector-codeagentsim
spec:
  type: ClusterIP
  selector:
    app: otel-collector-codeagentsim
  ports:
    - name: otlp-grpc
      port: 24317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 24318
      targetPort: otlp-http
      protocol: TCP
    - name: health
      port: 13134
      targetPort: health
      protocol: TCP
