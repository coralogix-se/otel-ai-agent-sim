apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector-codeagentsim
  namespace: codeagentsim
  labels:
    app: otel-collector-codeagentsim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector-codeagentsim
  template:
    metadata:
      labels:
        app: otel-collector-codeagentsim
    spec:
      containers:
        - name: otelcol
          # Live cluster was 0.115.1 until this rollout; 0.158.0 supports translation_strategy: NoTranslation.
          image: otel/opentelemetry-collector-contrib:0.158.0
          args:
            - --config=/etc/otelcol/config.yaml
          ports:
            - name: otlp-grpc
              containerPort: 24317
              protocol: TCP
            - name: otlp-http
              containerPort: 24318
              protocol: TCP
            - name: health
              containerPort: 13134
              protocol: TCP
          env:
            - name: CORALOGIX_PRIVATE_KEY_US2
              valueFrom:
                secretKeyRef:
                  name: coralogix-multi-export
                  key: private_key_us2
            - name: CORALOGIX_PRIVATE_KEY_EU1
              valueFrom:
                secretKeyRef:
                  name: coralogix-multi-export
                  key: private_key_eu1
            # onlineboutique-dev Coralogix instance (US2); same ingress as US2 exporter #1, different API key.
            - name: CORALOGIX_PRIVATE_KEY_ONLINEBOUTIQUE_DEV
              valueFrom:
                secretKeyRef:
                  name: coralogix-multi-export
                  key: private_key_onlineboutique_dev
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 1536Mi
            limits:
              cpu: "1"
              memory: 3Gi
      volumes:
        - name: config
          configMap:
            name: otel-collector-codeagentsim-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-codeagentsim
  namespace: codeagentsim
  labels:
    app: otel-collector-codeagentsim
spec:
  type: ClusterIP
  selector:
    app: otel-collector-codeagentsim
  ports:
    - name: otlp-grpc
      port: 24317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 24318
      targetPort: otlp-http
      protocol: TCP
    - name: health
      port: 13134
      targetPort: health
      protocol: TCP
