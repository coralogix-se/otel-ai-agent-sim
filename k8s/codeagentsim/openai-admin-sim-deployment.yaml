# Standalone OpenAI API Platform (Administration) simulator.
# Separate process from otel-ai-agent-sim / anthropic-admin.
# Prometheus scraped on :9090 by otel-collector-codeagentsim (no direct remote_write).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-openai-admin-sim
  namespace: codeagentsim
  labels:
    app: otel-openai-admin-sim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-openai-admin-sim
  template:
    metadata:
      labels:
        app: otel-openai-admin-sim
    spec:
      initContainers:
        - name: wait-for-collector
          image: busybox:1.36
          command:
            - sh
            - -c
            - "until nc -z otel-collector-codeagentsim 24317; do echo waiting for otel collector otlp-grpc; sleep 2; done"
      containers:
        - name: sim
          image: 827602716714.dkr.ecr.us-west-2.amazonaws.com/otel-ai-agent-sim:openai-admin-20261001081508
          imagePullPolicy: Always
          command: ["python", "-m", "sim.openai"]
          env:
            - name: PROMETHEUS_METRICS_PORT
              value: "9090"
            - name: PROMETHEUS_REMOTE_WRITE_ENABLED
              value: "false"
            - name: OPENAI_ADMIN_CX_APPLICATION_NAME
              value: OpenAI
            - name: OPENAI_ADMIN_CX_SUBSYSTEM_NAME
              value: API Platform
            - name: DEPLOYMENT_ENVIRONMENT
              value: codeagentsim
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: SIM_OPENAI_ADMIN_INTERVAL_SEC
              value: "60"
            - name: SIM_OPENAI_ADMIN_USERS
              value: "40"
            - name: SIM_OPENAI_ADMIN_PROJECTS
              value: "10"
            - name: SIM_OPENAI_ADMIN_API_KEYS
              value: "22"
            - name: SIM_OPENAI_ADMIN_SERVICE_ACCOUNTS
              value: "5"
            - name: SIM_OPENAI_ADMIN_ADMIN_KEYS
              value: "2"
            - name: SIM_OPENAI_ADMIN_BACKFILL_DAYS
              value: "28"
          ports:
            - name: metrics
              containerPort: 9090
              protocol: TCP
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: otel-openai-admin-sim
  namespace: codeagentsim
  labels:
    app: otel-openai-admin-sim
spec:
  type: ClusterIP
  selector:
    app: otel-openai-admin-sim
  ports:
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
