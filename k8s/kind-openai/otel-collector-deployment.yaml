# Kind-local US2-only collector (lighter resources than EKS). Includes Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector-codeagentsim
  namespace: codeagentsim
  labels:
    app: otel-collector-codeagentsim
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-collector-codeagentsim
  template:
    metadata:
      labels:
        app: otel-collector-codeagentsim
    spec:
      initContainers:
        - name: coralogix-ipv4-hosts
          image: busybox:1.36
          command:
            - sh
            - -ec
            - |
              IP=$(nslookup ingress.us2.coralogix.com 2>/dev/null | awk '/^Address: / { print $2 }' | grep -E '^[0-9]+\.' | tail -1)
              if [ -z "$IP" ]; then echo "failed to resolve ingress.us2.coralogix.com A record"; exit 1; fi
              grep -v '[[:space:]]ingress\.us2\.coralogix\.com$' /etc/hosts > /work/hosts
              echo "$IP ingress.us2.coralogix.com" >> /work/hosts
              echo "pinned ingress.us2.coralogix.com -> $IP"
          volumeMounts:
            - name: etc-hosts
              mountPath: /work
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector-contrib:0.158.0
          args:
            - --config=/etc/otelcol/config.yaml
          ports:
            - name: otlp-grpc
              containerPort: 24317
              protocol: TCP
            - name: otlp-http
              containerPort: 24318
              protocol: TCP
            - name: health
              containerPort: 13134
              protocol: TCP
          env:
            - name: CORALOGIX_PRIVATE_KEY_US2
              valueFrom:
                secretKeyRef:
                  name: coralogix-multi-export
                  key: private_key_us2
          volumeMounts:
            - name: etc-hosts
              mountPath: /etc/hosts
              subPath: hosts
              readOnly: true
            - name: config
              mountPath: /etc/otelcol
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "500m"
              memory: 768Mi
      volumes:
        - name: etc-hosts
          emptyDir: {}
        - name: config
          configMap:
            name: otel-collector-codeagentsim-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector-codeagentsim
  namespace: codeagentsim
  labels:
    app: otel-collector-codeagentsim
spec:
  type: ClusterIP
  selector:
    app: otel-collector-codeagentsim
  ports:
    - name: otlp-grpc
      port: 24317
      targetPort: otlp-grpc
      protocol: TCP
    - name: otlp-http
      port: 24318
      targetPort: otlp-http
      protocol: TCP
    - name: health
      port: 13134
      targetPort: health
      protocol: TCP
